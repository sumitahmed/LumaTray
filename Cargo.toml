[package]
name = "luma-tray"
version = "0.2.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
parking_lot = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Devices_Display", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Ole", "Win32_System_Variant", "Win32_Security", "Win32_System_Rpc", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_System_Power", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_HiDpi"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true


